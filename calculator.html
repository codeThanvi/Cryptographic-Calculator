<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modular Arithmetic Worksheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --paper: #EEF2F0;
    --grid-line: #D6DEDC;
    --ink: #1C2B39;
    --ink-soft: #5B6B76;
    --pen: #C1443D;
    --pen-dim: #E3B3AF;
    --card: #FBFCFB;
    --card-edge: #C9D3D0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px;
  }

  .sheet {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    box-shadow: 3px 3px 0 rgba(28, 43, 57, 0.06);
    padding: 36px 32px 32px;
  }

  .title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 2px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 28px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 20px;
  }

  input[type="text"] {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    padding: 11px 12px;
    border: 1.5px solid var(--card-edge);
    background: #fff;
    color: var(--ink);
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus {
    border-color: var(--ink);
  }

  input[type="text"].error {
    border-color: var(--pen);
  }

  .ops {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 26px 0 24px;
  }

  .op-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1.5px solid var(--card-edge);
    background: #fff;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.12s ease, color 0.12s ease, transform 0.06s ease;
  }

  .op-btn:hover {
    border-color: var(--pen-dim);
  }

  .op-btn:active {
    transform: scale(0.94);
  }

  .op-btn.active {
    border-color: var(--pen);
    color: var(--pen);
    border-width: 2px;
  }

  .rule {
    border: none;
    border-top: 1.5px solid var(--ink);
    margin: 4px 0 20px;
  }

  .answer-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .equals {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    color: var(--ink-soft);
  }

  .answer {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight: 500;
    color: var(--pen);
    word-break: break-all;
    line-height: 1.5;
    min-height: 26px;
  }

  .answer.placeholder {
    color: var(--ink-soft);
    font-weight: 400;
    font-style: normal;
  }

  .status {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 24px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="sheet">
  <p class="title">Modular Arithmetic Worksheet</p>
  <p class="subtitle">Whole numbers of any size, computed with a from-scratch bignum engine.</p>

  <div class="field">
    <label for="numA">A</label>
    <input type="text" id="numA" inputmode="numeric" placeholder="e.g. 123456789012345678901234567890" autocomplete="off">
  </div>

  <div class="ops">
    <button class="op-btn" data-op="add" title="Add">+</button>
    <button class="op-btn" data-op="sub" title="Subtract">&minus;</button>
    <button class="op-btn" data-op="mul" title="Multiply">&times;</button>
    <button class="op-btn" data-op="div" title="Divide (quotient)">&divide;</button>
    <button class="op-btn" data-op="mod" title="Modulo (remainder)">%</button>
  </div>

  <div class="field" style="margin-bottom: 24px;">
    <label for="numB">B</label>
    <input type="text" id="numB" inputmode="numeric" placeholder="e.g. 987654321098765432109876543210" autocomplete="off">
  </div>

  <hr class="rule">

  <div class="answer-row">
    <span class="equals">=</span>
    <span class="answer placeholder" id="answer">enter two numbers and pick an operation</span>
  </div>

  <p class="status" id="status">loading calculation engine&hellip;</p>
</div>

  let currentOp = null;

  BignumModule().then((Module) => {
    calc = Module.cwrap('bignum_calculate', 'string', ['string', 'string', 'string']);
    statusEl.textContent = 'engine ready';
    setTimeout(() => { statusEl.textContent = ''; }, 1200);
    compute();
  }).catch((err) => {
    statusEl.textContent = 'engine failed to load';
    console.error(err);
  });

  function setActiveOp(op) {
    currentOp = op;
    opButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.op === op));
    compute();
  }

  opButtons.forEach(btn => {
    btn.addEventListener('click', () => setActiveOp(btn.dataset.op));
  });

  function compute() {
    if (!calc || !currentOp) return;
    const a = inputA.value.trim();
    const b = inputB.value.trim();
    inputA.classList.remove('error');
    inputB.classList.remove('error');

    if (!a || !b) {
      answerEl.textContent = 'enter two numbers and pick an operation';
      answerEl.classList.add('placeholder');
      return;
    }

    const result = calc(a, b, currentOp);
    answerEl.classList.remove('placeholder');
    if (result.startsWith('Error')) {
      answerEl.textContent = result;
      if (result.includes('whole numbers')) {
        if (!/^-?[0-9]+$/.test(a)) inputA.classList.add('error');
        if (!/^-?[0-9]+$/.test(b)) inputB.classList.add('error');
      }
    } else {
      answerEl.textContent = result;
    }
  }

  inputA.addEventListener('input', compute);
  inputB.addEventListener('input', compute);

  // default to addition once loaded
  setActiveOp('add');
})();
</script>
</body>
</html>
