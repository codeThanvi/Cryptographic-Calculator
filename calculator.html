<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modular Arithmetic Worksheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --paper: #EEF2F0;
    --grid-line: #D6DEDC;
    --ink: #1C2B39;
    --ink-soft: #5B6B76;
    --pen: #C1443D;
    --pen-dim: #E3B3AF;
    --card: #FBFCFB;
    --card-edge: #C9D3D0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px;
  }

  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    box-shadow: 3px 3px 0 rgba(28, 43, 57, 0.06);
    padding: 36px 32px 32px;
  }

  .title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 2px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 24px;
    line-height: 1.5;
  }

  .group-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 22px 0 10px;
  }

  .group-label:first-of-type { margin-top: 0; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 18px;
  }

  input[type="text"] {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    padding: 11px 12px;
    border: 1.5px solid var(--card-edge);
    background: #fff;
    color: var(--ink);
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus {
    border-color: var(--ink);
  }

  input[type="text"].error {
    border-color: var(--pen);
  }

  .op-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }

  .op-btn {
    padding: 8px 14px;
    border-radius: 16px;
    border: 1.5px solid var(--card-edge);
    background: #fff;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease, transform 0.06s ease;
    white-space: nowrap;
  }

  .op-btn:hover {
    border-color: var(--pen-dim);
  }

  .op-btn:active {
    transform: scale(0.96);
  }

  .op-btn.active {
    border-color: var(--pen);
    color: var(--pen);
    border-width: 2px;
    font-weight: 600;
  }

  .rule {
    border: none;
    border-top: 1.5px solid var(--ink);
    margin: 20px 0 20px;
  }

  .answer-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .equals {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    color: var(--ink-soft);
  }

  .answer {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    color: var(--pen);
    word-break: break-all;
    line-height: 1.6;
    min-height: 26px;
    white-space: pre-wrap;
  }

  .answer.placeholder {
    color: var(--ink-soft);
    font-weight: 400;
  }

  .status {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 22px;
    text-align: center;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="sheet">
  <p class="title">Modular Arithmetic Worksheet</p>
  <p class="subtitle">Whole numbers of any size, computed with a from-scratch bignum engine.</p>

  <p class="group-label">Operation</p>
  <div class="op-row">
    <button class="op-btn" data-op="add" data-c="false">A + B</button>
    <button class="op-btn" data-op="sub" data-c="false">A &minus; B</button>
    <button class="op-btn" data-op="mul" data-c="false">A &times; B</button>
    <button class="op-btn" data-op="div" data-c="false">A &divide; B</button>
    <button class="op-btn" data-op="mod" data-c="false">A % B</button>
    <button class="op-btn" data-op="gcd" data-c="false">gcd(A, B)</button>
    <button class="op-btn" data-op="extgcd" data-c="false">extended gcd(A, B)</button>
    <button class="op-btn" data-op="modinv" data-c="false">A&supminus;&sup1; mod B</button>
    <button class="op-btn" data-op="modadd" data-c="true">(A + B) mod M</button>
    <button class="op-btn" data-op="modmul" data-c="true">(A &times; B) mod M</button>
    <button class="op-btn" data-op="modpow" data-c="true">A^B mod M</button>
  </div>

  <p class="group-label" id="labelA">A</p>
  <div class="field">
    <input type="text" id="numA" inputmode="numeric" placeholder="e.g. 123456789012345678901234567890" autocomplete="off">
  </div>

  <p class="group-label" id="labelB">B</p>
  <div class="field">
    <input type="text" id="numB" inputmode="numeric" placeholder="e.g. 987654321098765432109876543210" autocomplete="off">
  </div>

  <div id="fieldC">
    <p class="group-label" id="labelC">M (modulus)</p>
    <div class="field" style="margin-bottom: 8px;">
      <input type="text" id="numC" inputmode="numeric" placeholder="e.g. 1000000007" autocomplete="off">
    </div>
  </div>

  <hr class="rule">

  <div class="answer-row">
    <span class="equals">=</span>
    <span class="answer placeholder" id="answer">pick an operation and enter numbers</span>
  </div>

  <p class="status" id="status">loading calculation engine&hellip;</p>
</div>

<script>
(function() {
  const inputA = document.getElementById('numA');
  const inputB = document.getElementById('numB');
  const inputC = document.getElementById('numC');
  const fieldC = document.getElementById('fieldC');
  const labelA = document.getElementById('labelA');
  const labelB = document.getElementById('labelB');
  const answerEl = document.getElementById('answer');
  const statusEl = document.getElementById('status');
  const opButtons = Array.from(document.querySelectorAll('.op-btn'));

  const labelMap = {
    add: ['A', 'B'], sub: ['A', 'B'], mul: ['A', 'B'], div: ['A', 'B'],
    mod: ['A', 'B'], gcd: ['A', 'B'],
    extgcd: ['A', 'B'],
    modinv: ['A (value)', 'B (modulus n)'],
    modadd: ['A', 'B'], modmul: ['A', 'B'],
    modpow: ['A (base)', 'B (exponent)']
  };

  let calc = null;
  let currentOp = null;

  BignumModule().then((Module) => {
    calc = Module.cwrap('bignum_calculate', 'string', ['string', 'string', 'string', 'string']);
    statusEl.textContent = 'engine ready';
    setTimeout(() => { statusEl.textContent = ''; }, 1200);
    setActiveOp('add');
  }).catch((err) => {
    statusEl.textContent = 'engine failed to load';
    console.error(err);
  });

  function setActiveOp(op) {
    currentOp = op;
    const btn = opButtons.find(b => b.dataset.op === op);
    opButtons.forEach(b => b.classList.toggle('active', b === btn));
    const needsC = btn.dataset.c === 'true';
    fieldC.classList.toggle('hidden', !needsC);
    const [la, lb] = labelMap[op];
    labelA.textContent = la;
    labelB.textContent = lb;
    compute();
  }

  opButtons.forEach(btn => {
    btn.addEventListener('click', () => setActiveOp(btn.dataset.op));
  });

  function compute() {
    if (!calc || !currentOp) return;
    const a = inputA.value.trim();
    const b = inputB.value.trim();
    const needsC = fieldC && !fieldC.classList.contains('hidden');
    const c = needsC ? inputC.value.trim() : '';

    inputA.classList.remove('error');
    inputB.classList.remove('error');
    inputC.classList.remove('error');

    if (!a || !b || (needsC && !c)) {
      answerEl.textContent = 'enter ' + (needsC ? 'A, B, and M' : 'A and B');
      answerEl.classList.add('placeholder');
      return;
    }

    const result = calc(a, b, c, currentOp);
    answerEl.classList.remove('placeholder');
    answerEl.textContent = result;
    if (result.startsWith('Error') && result.includes('whole numbers')) {
      if (!/^-?[0-9]+$/.test(a)) inputA.classList.add('error');
      if (!/^-?[0-9]+$/.test(b)) inputB.classList.add('error');
      if (needsC && !/^-?[0-9]+$/.test(c)) inputC.classList.add('error');
    }
  }

  inputA.addEventListener('input', compute);
  inputB.addEventListener('input', compute);
  inputC.addEventListener('input', compute);
})();
</script>
